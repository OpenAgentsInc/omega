name: Report a bug
description: Report a problem with Omega.
type: Bug
labels: "state:needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Is this bug already reported? Upvote to get it noticed faster. [Search Omega issues](https://github.com/OpenAgentsInc/omega/issues). Upvote means giving it a :+1: reaction.

        Feature request? Prefer the alpha feedback tester channel in the Omega sidebar, or open a focused issue only when the request is concrete and actionable.

        Alpha triage ownership, severity definitions, response expectations, and privacy/log guidance live in [Alpha Feedback](https://github.com/OpenAgentsInc/omega/blob/main/docs/src/alpha-feedback.md). Loose reports and impressions belong in the alpha feedback tester channel, not in issues.
  - type: input
    id: omega_version
    attributes:
      label: Omega version and commit
      description: |
        The exact build this report binds to. Paste the version string from the sidebar footer (the Settings row) — `v0.2.0 b28` on an installed candidate, `v0.2.0 dev` on a source build. For the full commit, run `omega: copy system specs into clipboard` from the command palette and paste the version line.
      placeholder: "v0.2.0 b28 (installed candidate) or v0.2.0 dev (source build; add the commit from system specs)"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the bug from a **clean Omega install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Omega
        2. Click X
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      description: |
        Current behavior (screenshots, videos, etc. are appreciated), vs. what you expected the behavior to be.

      placeholder: |
        Current behavior: <screenshot with an arrow> The icon is blue. Expected behavior: The icon should be red because this is what the setting is documented to do.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Omega version and system specs
      description: |
        Open the command palette in Omega, then type "omega: copy system specs into clipboard".
      placeholder: |
        Omega: v0.2.0 b28
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Omega log file
      description: |
        Open the command palette in Omega, then type `omega: open log` to see the last 1000 lines. Or type `omega: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Omega.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Omega settings
      description: |
        Open the command palette in Omega, then type "omega: open settings file" and copy/paste any relevant (e.g., LSP-specific) settings.

        ⚠️ **Please review your settings file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>settings.json</summary>

        <!-- Paste your settings inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Keymap
      description: |
        Open the command palette in Omega, then type "omega: open keymap file" and copy/paste the file's contents.
      value: |
        <details><summary>keymap.json</summary>

        <!-- Paste your keymap file inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: (for AI issues) Model provider details
      placeholder: |
        - Provider: (Codex, Claude Code, Grok, Anthropic API key, etc.)
        - Model Name: (if known)
        - Mode: (Direct Agent, Omega Agent, or Sarah)
        - Other details (ACPs, MCPs, other settings, etc.):
    validations:
      required: false
  - type: dropdown
    attributes:
      label: If you are using WSL on Windows, what flavor of Linux are you using?
      multiple: false
      options:
        - Arch Linux
        - Ubuntu
        - Fedora
        - Mint
        - Pop!_OS
        - NixOS
        - Other
