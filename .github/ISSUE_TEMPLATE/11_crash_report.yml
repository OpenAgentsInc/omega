name: Report a crash
description: Omega is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Alpha triage ownership, severity definitions, response expectations, and privacy/log guidance live in [Alpha Feedback](https://github.com/OpenAgentsInc/omega/blob/main/docs/src/alpha-feedback.md).
  - type: input
    id: omega_version
    attributes:
      label: Omega version and commit
      description: |
        The exact build this report binds to. Paste the version string from the sidebar footer (the Settings row) — `v0.2.0 b28` on an installed candidate, `v0.2.0 dev` on a source build. For the full commit, run `omega: copy system specs into clipboard` from the command palette and paste the version line.
      placeholder: "v0.2.0 b28 (installed candidate) or v0.2.0 dev (source build; add the commit from system specs)"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Omega install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Omega
        2. Perform an action
        3. Omega crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Omega version and system specs
      description: |
        Open the command palette in Omega, then type “omega: copy system specs into clipboard”.
      placeholder: |
        Omega: v0.2.0 b28
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Omega log file
      description: |
        Open the command palette in Omega, then type `omega: open log` to see the last 1000 lines. Or type `omega: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Omega.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
