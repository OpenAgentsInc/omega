name: Omega workbench proof

on:
  merge_group: {}
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: omega-workbench-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  model_conformance:
    name: Projection model and conformance
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out Omega
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false

      - name: Install pinned Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21.0.8+9

      - name: Configure Cargo for CI
        run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml

      - name: Exhaust bounded model, probes, and mutations
        env:
          TLC_WORKERS: "4"
        run: script/omega-workbench-model

      - name: Check independent traces and production reducer conformance
        run: >-
          cargo test
          -p omega_workbench_state
          -p omega_workbench_conformance
          -p omega_workbench_harness
          -- --nocapture

      - name: Remove CI Cargo configuration
        if: always()
        run: rm -rf ../.cargo

  portable_semantics:
    name: Portable semantics
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Omega
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false

      - name: Configure Cargo for CI
        run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Test workbench fixtures, selection, pixels, and receipts
        run: cargo test -p omega_workbench_harness --features gpui-support -- --nocapture

      - name: Test the production Agent UI scene adapter
        run: >-
          cargo test -p agent_ui --features test-support
          typed_fixture_drives_rendered_front_door_semantics -- --nocapture

      - name: Sweep deterministic GPUI semantic-probe seeds
        env:
          ITERATIONS: "16"
          SEED: "0"
        run: cargo test -p gpui debug_render_snapshot -- --nocapture

      - name: Prove pending work and retained entities fail deterministically
        run: |
          cargo test -p scheduler test_parking_panics -- --nocapture
          cargo test -p gpui test_leak_detector_snapshot_detects_new_leak -- --nocapture

      - name: Remove CI Cargo configuration
        if: always()
        run: rm -rf ../.cargo

  metal_pixels:
    name: Metal pixels (shard ${{ matrix.shard_index }})
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard_index:
          - 0
          - 1
    steps:
      - name: Check out Omega
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false

      - name: Require the Apple Silicon render authority
        run: |
          observed_architecture="$(uname -m)"
          if [[ "$observed_architecture" != "arm64" ]]; then
            echo "The committed Metal baselines require arm64, found $observed_architecture" >&2
            exit 1
          fi

      - name: Configure Cargo for CI
        run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml

      - name: Run the deterministic Metal proof shard
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          script/omega-workbench-proof \
            --pixel-only \
            --seed 0 \
            --shard-index "$SHARD_INDEX" \
            --shard-count 2 \
            --output "target/omega-workbench-proof/shard-$SHARD_INDEX"

      - name: Upload failed proof evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omega-workbench-proof-shard-${{ matrix.shard_index }}
          path: target/omega-workbench-proof/shard-${{ matrix.shard_index }}
          if-no-files-found: warn
          retention-days: 14

      - name: Remove CI Cargo configuration
        if: always()
        run: rm -rf ../.cargo

  required:
    name: Required
    if: always()
    needs:
      - model_conformance
      - portable_semantics
      - metal_pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every workbench proof lane
        env:
          METAL_PIXELS_RESULT: ${{ needs.metal_pixels.result }}
          MODEL_CONFORMANCE_RESULT: ${{ needs.model_conformance.result }}
          PORTABLE_SEMANTICS_RESULT: ${{ needs.portable_semantics.result }}
        run: |
          if [[ "$MODEL_CONFORMANCE_RESULT" != "success" ]]; then
            echo "Projection model and conformance: $MODEL_CONFORMANCE_RESULT" >&2
            exit 1
          fi
          if [[ "$PORTABLE_SEMANTICS_RESULT" != "success" ]]; then
            echo "Portable semantics: $PORTABLE_SEMANTICS_RESULT" >&2
            exit 1
          fi
          if [[ "$METAL_PIXELS_RESULT" != "success" ]]; then
            echo "Metal pixels: $METAL_PIXELS_RESULT" >&2
            exit 1
          fi
