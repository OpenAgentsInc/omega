[package]
name = "agent_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/agent_ui.rs"
doctest = false

[features]
test-support = [
    "acp_thread/test-support",
    "action_log/test-support",
    "eval_utils",
    "gpui/test-support",
    "git_ui/test-support",
    "language/test-support",
    "language_model/test-support",
    "dep:omega_workbench_harness",
    "project_panel/test-support",
    "reqwest_client",
    "remote_connection/test-support",
    "search/test-support",
    "terminal/test-support",
    "terminal_view/test-support",
    "workspace/test-support",
    "agent/test-support",
]
audio = ["dep:audio", "dep:cpal", "dep:livekit", "dep:rodio", "dep:tokio"]
unit-eval = []

[dependencies]
acp_thread.workspace = true
action_log.workspace = true
agent-client-protocol.workspace = true
agent.workspace = true
async-channel.workspace = true
async-std.workspace = true
# OMEGA-DELTA-0129. The sidebar's public-chat section reads one NIP-29 group
# over one websocket. Same feature set as `omega_effectd`'s relay adapter, so
# this adds a link and not a second TLS or runtime stack to the build.
async-tungstenite = { workspace = true, features = [
    "async-native-tls",
    "async-std-runtime",
] }
