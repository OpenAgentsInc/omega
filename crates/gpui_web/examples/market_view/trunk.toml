[build]
# The Zig C boundary deliberately enables undefined-behavior checks in debug;
# the browser artifact uses the same release mode as the verified wasm gate.
release = true
locked = true

[serve]
addresses = ["127.0.0.1"]
port = 8084
open = false

# Headers required for WebGPU / SharedArrayBuffer support.
headers = { "Cross-Origin-Embedder-Policy" = "require-corp", "Cross-Origin-Opener-Policy" = "same-origin" }
