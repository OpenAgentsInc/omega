[package]
description = "The OpenAgents desktop client and integrated development environment."
edition.workspace = true
name = "omega"
# Omega's own release lineage, not upstream Zed's. This is the fallback that
# AppVersion::load compiles into dev builds (main.rs env!("CARGO_PKG_VERSION"))
# and the base the RC pipeline (script/bundle-omega-rc set_channel_and_version)
# rewrites to the current RC semver at package time.
version = "0.2.0"
publish.workspace = true
license = "GPL-3.0-or-later"
authors = ["OpenAgents <hello@openagents.com>"]
default-run = "omega"

[lints]
workspace = true

[features]
default = ["lnmarkets"]
lnmarkets = ["dep:lnmarkets"]
tracy = ["ztracing/tracy"]
# LEAK_BACKTRACE=1 cargo run --features omega/track-project-leak --profile release-fast
track-project-leak = ["gpui/leak-detection"]
test-support = [
    "gpui/test-support",
    "gpui_platform/screen-capture",
    "dep:image",
    "workspace/test-support",
    "project/test-support",
    "editor/test-support",
    "terminal_view/test-support",
    "title_bar/test-support",
]
visual-tests = [
    "gpui/test-support",
    "gpui_platform/screen-capture",
    "gpui_platform/test-support",
    "dep:image",
    "dep:tempfile",
    "dep:action_log",
    "dep:agent_servers",
    "dep:omega_workbench_harness",
    "dep:omega_workbench_state",
    "workspace/test-support",
    "project/test-support",
    "editor/test-support",
    "terminal_view/test-support",
    "clock/test-support",
    "acp_thread/test-support",
    "action_log/test-support",
    "agent_ui/test-support",
    "db/test-support",
    "agent/test-support",
    "language_model/test-support",
    "fs/test-support",
    "title_bar/test-support",
    "settings_ui/test-support",
]

[[bin]]
name = "omega"
path = "src/main.rs"

[[bin]]
name = "zed_visual_test_runner"
path = "src/visual_test_runner.rs"
required-features = ["visual-tests"]

