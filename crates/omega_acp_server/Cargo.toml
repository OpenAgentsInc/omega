[package]
name = "omega_acp_server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/omega_acp_server.rs"
doctest = false

# The listener has a binary of its own so it can be supervised as a child, and
# so a conformance run against an external ACP host does not need a windowing
# system. `omega-effectd` owns the lifecycle in a shipped build; see the module
# docs on why the socket is deliberately not in a GPUI crate.
[[bin]]
name = "omega-acp-server"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
log.workspace = true
omega_front_door.workspace = true
serde_json.workspace = true

[dev-dependencies]
futures.workspace = true
smol.workspace = true
