[package]
name = "omega_convex"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/omega_convex.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-channel = { workspace = true, optional = true }
async-std = { workspace = true, optional = true }
async-tungstenite = { workspace = true, features = ["async-native-tls", "async-std-runtime"], optional = true }
convex.workspace = true
futures.workspace = true
gpui.workspace = true
http_client_tls.workspace = true
log.workspace = true
omega_effectd.workspace = true
platform_title_bar.workspace = true
release_channel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
smol.workspace = true
tokio.workspace = true
ui.workspace = true
util.workspace = true
uuid = { workspace = true, optional = true }
workspace.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true

[[bin]]
name = "omega_convex_canary"
path = "src/bin/omega_convex_canary.rs"
required-features = ["live-canary"]

[features]
live-canary = ["dep:async-channel", "dep:async-std", "dep:async-tungstenite", "dep:sha2", "dep:uuid"]
