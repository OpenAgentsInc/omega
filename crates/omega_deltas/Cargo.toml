[package]
name = "omega_deltas"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/omega_deltas.rs"

[dependencies]
serde_json.workspace = true
sha2.workspace = true

# OMEGA-DELTA-0102. The three Exo law crates, so the registry can check the two
# decisions over Exo's protocol by *calling* them rather than by scraping their
# source for a list it also holds. All three are leaves — no gpui, no process,
# no filesystem — so this does not make the delta checks build the UI.
[dev-dependencies]
omega_exo_episode.workspace = true
omega_exo_lane.workspace = true
omega_exo_log.workspace = true
toml.workspace = true

# OMEGA-DELTA-0203. The delegable-agent catalog, so the check that every listed
# agent can be started reads the list itself rather than a copy of it. Another
# leaf: no gpui, no process launch.
omega_agent_detect.workspace = true

# OMEGA-DELTA-0209. SCV itself, so the check that Omega advertises a request
# SCV accepts asks SCV rather than comparing two strings this crate holds. The
# agent is a leaf with no gpui and no dependency on Omega's catalog, which is
# exactly why the two spellings exist and why they have to be checked.
scv.workspace = true

# OMEGA-DELTA-0125. The zero-base admitted set, so the check on the thread
# header's menu asks the gate whether an entry's action is refused rather than
# keeping a second copy of the answer. A list restated in a test is a list that
# goes stale silently, which is the failure mode this whole crate exists for.
# Another leaf: no gpui, no process, no filesystem.
omega_zero_base.workspace = true
