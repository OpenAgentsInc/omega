[package]
name = "omega_effectd"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/omega_effectd.rs"
doctest = false

[dependencies]
anyhow.workspace = true
app_identity.workspace = true
async-io.workspace = true
async-tungstenite = { workspace = true, features = ["async-native-tls", "async-std-runtime"] }
base64.workspace = true
credentials_provider.workspace = true
futures.workspace = true
gpui.workspace = true
http_client.workspace = true
log.workspace = true
nostr = { workspace = true, features = ["nip59"] }
omega_acp_server.workspace = true
omega_device_bridge.workspace = true
omega_identity.workspace = true
omega_signer_broker.workspace = true
paths.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smol.workspace = true
thiserror.workspace = true
url.workspace = true
util.workspace = true
workroom_receipts.workspace = true
zed_credentials_provider.workspace = true

[features]
default = []
# Headless proof harnesses: supply the owner key directly instead of reading it
# from GPUI-backed identity custody. Never enabled by a shipped build.
test-support = []

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
