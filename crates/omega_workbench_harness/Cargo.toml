[package]
name = "omega_workbench_harness"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Deterministic scene, semantic, and pixel proof support for Omega's desktop workbench"

[lints]
workspace = true

[lib]
path = "src/omega_workbench_harness.rs"
doctest = false

[features]
gpui-support = ["dep:gpui"]

[dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"], optional = true }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
