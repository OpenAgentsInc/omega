[package]
name = "scv"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Space Construction Vehicle: hyper-lightweight read-only ACP agent (v0.1)"

[lints]
workspace = true

[lib]
path = "src/scv.rs"

[[bin]]
name = "scv"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "ansi",
    "env-filter",
] }

[dev-dependencies]
tempfile.workspace = true

# OMEGA-DELTA-0209. The delegable-agent catalog, so the live delegation test
# drives SCV with the contract Omega actually advertises and the shaping Omega
# actually applies, rather than with a copy of them. A dev-dependency only: the
# shipped `scv` binary stays a leaf that depends on nothing of Omega's.
omega_agent_detect.workspace = true
