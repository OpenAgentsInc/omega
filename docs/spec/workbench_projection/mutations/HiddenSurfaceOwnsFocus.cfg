SPECIFICATION Spec

CONSTANTS
    Threads = {threadA, threadB}
    Repositories = {repositoryA, repositoryB}
    Worktrees = {worktreeA, worktreeB}
    PrimaryThread = threadA
    SecondaryThread = threadB
    PrimaryRepository = repositoryA
    SecondaryRepository = repositoryB
    PrimaryWorktree = worktreeA
    SecondaryWorktree = worktreeB
    MaxGeneration = 1
    MaxRevision = 1
    MaxSteps = 1
    Scenario = "HiddenOwner"
    MutAcceptStaleCompletion = FALSE
    MutRestorePreviousThread = FALSE
    MutHiddenOwner = TRUE
    MutApplyOlderRevision = FALSE
    MutKeepMissingWorktree = FALSE
    MutNondeterministicFallback = FALSE
    DisableStaleCompletionAction = FALSE
    DisableSettleAction = FALSE

INVARIANT Inv_SingleOwner

CHECK_DEADLOCK FALSE
